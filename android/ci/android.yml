# Builds the Android app (APK) in the cloud on every push that changes android/, and on demand
# (GitHub → Actions → "Android APK" → Run workflow). Download the APK from the run's "Artifacts".
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared maths and data (core)
        run: bash ./gradlew --no-daemon :core:test

      - name: Build the APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/BMPCC-Control-android-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BMPCC-Control-android
          path: android/out/*.apk
          retention-days: 30

      - name: Test report (if tests failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/core/build/reports/tests/
