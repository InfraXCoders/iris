name: BMPCCControl
options:
  bundleIdPrefix: com.infraxcoders
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  RecceKit:
    path: RecceKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_CFBundleDisplayName: BMPCC Control
    INFOPLIST_KEY_NSCameraUsageDescription: The director's viewfinder uses the camera to show your cinema camera's framing.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Voice notes use the microphone while you speak a recce note.
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Voice notes are turned into text so they can be sorted and added to the report.
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is saved with the recce and used for sunrise, sunset and golden hour.
    INFOPLIST_KEY_NSLocationUsageDescription: Your location is saved with the recce and used for sunrise, sunset and golden hour.
targets:
  BMPCCControl-iOS:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources: [BMPCCControl]
    dependencies:
      - package: RecceKit
    settings:
      base:
        PRODUCT_NAME: BMPCCControl
        PRODUCT_MODULE_NAME: BMPCCControl
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).bmpcccontrol
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
  BMPCCControl-macOS:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources: [BMPCCControl]
    dependencies:
      - package: RecceKit
    settings:
      base:
        PRODUCT_NAME: BMPCCControl
        PRODUCT_MODULE_NAME: BMPCCControl
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).bmpcccontrol.mac
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
  BMPCCControl-iOSTests:
    type: bundle.unit-test
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    platform: iOS
    sources: [BMPCCControlTests]
    dependencies:
      - target: BMPCCControl-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).bmpcccontrol.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BMPCCControl.app/BMPCCControl"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BMPCCControl-macOSTests:
    type: bundle.unit-test
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    platform: macOS
    sources: [BMPCCControlTests]
    dependencies:
      - target: BMPCCControl-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).bmpcccontrol.mac.tests
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BMPCCControl.app/Contents/MacOS/BMPCCControl"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BMPCCControl-iOS:
    build:
      targets:
        BMPCCControl-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [BMPCCControl-iOSTests]
  BMPCCControl-macOS:
    build:
      targets:
        BMPCCControl-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [BMPCCControl-macOSTests]
